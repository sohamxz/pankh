[package]
name = "pankh"
version = "0.1.1"
edition = "2021"
description = "Featherweight Markdown Reader for Humans & AI Agents"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.11"
ratatui = "0.28"
crossterm = "0.28"
syntect = { version = "5.2", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes", "default-themes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
arboard = "3.4"
unicode-width = "0.1"
notify = "6.1"
rayon = "1.10"
once_cell = "1.19"
wry = "0.47"
tao = "0.30"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
